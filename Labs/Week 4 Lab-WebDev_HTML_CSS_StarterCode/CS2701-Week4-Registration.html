<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Fresh Food For All
        </title>
        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>
    <body>
        <header></header>
        <nav>
            <ul class="navlist">
                <li><a href="#">Home</a></li>
                <li><a href="#">Register</a></li>
                <li><a href="#">Login</a></li>
                <li><a href="#">Help</a></li>
            </ul>
         </nav>
        <main>
            <aside>
                <h2>Search</h2>
                <form class="search">
                    <label for="search">Search produce:</label>
                    <input type="search" id="search" name="search">
                </form>
            </aside>
            <section>
                <form class="center" novalidate>
                    <label for="name">Name:</label>
                    <input class="textInput" type="text" id="name" name="name" required><br>

                    <label for="email">Email:</label>
                    <input class="textInput" type="email" id="email" name="email" required><br>

                    <label for="password">Password:</label>
                    <input class="textInput" type="password" id="password" name="password" required><br><br>

                    <!-- Example given for user type checkboxes-->
                    <input type="checkbox" id="buyer" name="buyer" value="buyer">
                    <label for="buyer">I want to buy produce directly from allotment owners.</label><br>
                    <input type="checkbox" id="seller" name="seller" value="seller">
                    <label for="seller">I want to sell produce from my allotment.</label><br><br>

                    <input type="checkbox" id="tos" name="tos" value="agreed" required>
                    <label for="tos">I agree to the Terms of Service.</label><br><br>

                    <button type="submit" id="registerBtn">Register</button>
                    <a href="#" id="learnMore">Learn more</a>
                    <br><br>
                </form>
                <div class="center" id="hiddenSection">
                    <p id="hiddenParagraph"></p>
                </div>
            </section>
        </main>
    </body>
</html>
